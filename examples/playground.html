<!DOCTYPE html>
<!--
  wireface — playground · https://github.com/styk-tv/wireface
  MIT © 2026 Peter Styk

  Minimal: canvas, sample audio loops, ←/→ cycle presets, space toggles.
  Add your own: clone the repo, open examples/editor.html in a browser,
  tune sliders + colours, hit "save preset → ↓ download", paste the JSON
  literal into the PRESETS array below, send a PR.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wireface</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { width:100vw; height:100vh; display:block; outline:none; touch-action:none; }
  /* dim chrome, hover-brightens. mix-blend-mode keeps it readable on any face colour. */
  .wf-chrome { position:fixed; color:rgba(255,255,255,.32); mix-blend-mode:difference;
               font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
               letter-spacing:.18em; text-transform:uppercase;
               user-select:none; -webkit-user-select:none; }
  .wf-chrome a, .wf-chrome button { color:inherit; text-decoration:none;
               background:none; border:0; padding:0; margin:0; cursor:pointer;
               font:inherit; letter-spacing:inherit; text-transform:inherit;
               display:inline-flex; align-items:center; gap:8px; }
  .wf-chrome a:hover, .wf-chrome button:hover { color:rgba(255,255,255,.95); }
  .wf-chrome svg { width:14px; height:14px; fill:currentColor; display:block; }
  #wf-brand { top:14px; right:16px; }
  #wf-brand .name { letter-spacing:.32em; }
  #wf-bar { left:50%; bottom:18px; transform:translateX(-50%);
            display:flex; align-items:center; gap:22px; }
  #wf-bar button svg { width:18px; height:18px; }
  #wf-bar #wf-play svg { width:22px; height:22px; }
  #wf-hint { left:50%; bottom:46px; transform:translateX(-50%);
             font-size:9px; opacity:.55; white-space:nowrap; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="wf-brand" class="wf-chrome">
  <a href="https://github.com/styk-tv/wireface" target="_blank" aria-label="wireface on github">
    <span class="name">wireface</span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</div>

<div id="wf-hint" class="wf-chrome">drag .mp3 · ←/→ swap · space play</div>

<div id="wf-bar" class="wf-chrome">
  <a href="https://github.com/styk-tv/wireface" target="_blank" aria-label="github" title="github">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <button id="wf-prev" aria-label="previous preset" title="previous preset (←)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6V5zm14 0L8.5 12 20 19V5z"/></svg>
  </button>
  <button id="wf-play" aria-label="play/pause" title="play/pause (space)">
    <svg id="wf-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button id="wf-next" aria-label="next preset" title="next preset (→)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2V5zM4 5l11.5 7L4 19V5z"/></svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wireface@1/dist/wireface.min.js"></script>
<script>
/* PRESETS — full preset literals exactly as exported by the editor's
   "save preset → ↓ download" button. Append your own at the end; the UI
   adapts automatically (←/→ wraps the array). PR yours into
   examples/presets/ AND/OR append here so they land on the playground.
   First two are the loaded-on-init pair. */
const PRESETS = [
  {"version":"wireface-v010","createdAt":"2026-05-01T14:17:22.023Z","renderConfig":{"meshCols":17,"meshRows":23,"scaleNose":0.7000000000000001,"scaleEyes":0.45,"scaleMouth":1.1,"reactivity":0.22,"spread":1,"mode":"wire","pupils":true,"meshVisible":true,"minimal":true,"fragment":true,"glow":true,"flipFace":true,"loopAudio":true,"mouthHole":true,"mouthHoleSize":0.9,"eyeHoleSize":1.9500000000000002,"eyeHoles":true,"eyeDepth":0,"mouthAnchor":true,"eyeAnchor":true,"lineThickness":1,"lipVertAmp":0.5,"lipPressForce":0,"overlayTracksMesh":true,"moodTransitionTime":0.6000000000000001,"lineColor":"#ffffff","pupilColor":"#3e0f0f","baseColor":"#ca5858","fadeColor":"#000000","depthFade":1,"irisColor":"#121212","irisSize":1.6,"browColor":"#ffffff","jawExtend":1.1500000000000001,"mouthGrow":0,"depthFadeCurve":3,"upperJawProtrude":1.4500000000000002,"lowerJawProtrude":2.45,"mouthColor":"#454a1c","eyeColor":"#2c2b2b","noseColor":"#ffffff","minimalMouth":true,"minimalEyes":true,"minimalNose":false,"minimalBrows":false,"mouthLineThickness":0.2,"eyeLineThickness":0.2,"noseLineThickness":0.2,"browLineThickness":4},"channelGains":{},"activeMood":"neutral","moodTargetWeights":{"neutral":1},"id":"8pgwi9","name":"Wireface-001_8pgwi9"},
  {"version":"wireface-v010","createdAt":"2026-05-01T15:13:02.043Z","renderConfig":{"meshCols":9,"meshRows":9,"scaleNose":1.05,"scaleEyes":1.4,"scaleMouth":1.5500000000000003,"reactivity":0.3,"spread":1.6500000000000001,"mode":"wire","pupils":true,"meshVisible":true,"minimal":true,"fragment":true,"glow":true,"flipFace":true,"loopAudio":true,"mouthHole":true,"mouthHoleSize":0.9,"eyeHoleSize":0.9500000000000001,"eyeHoles":true,"eyeDepth":3.1500000000000004,"mouthAnchor":true,"eyeAnchor":true,"lineThickness":1,"lipVertAmp":0.5,"lipPressForce":0,"overlayTracksMesh":true,"moodTransitionTime":0.6000000000000001,"lineColor":"#ffffff","pupilColor":"#3e0f0f","baseColor":"#ca5858","fadeColor":"#000000","depthFade":1,"irisColor":"#121212","irisSize":1.6,"browColor":"#ffffff","jawExtend":1.1500000000000001,"mouthGrow":0,"depthFadeCurve":3,"upperJawProtrude":1.4500000000000002,"lowerJawProtrude":2.45,"mouthColor":"#454a1c","eyeColor":"#2c2b2b","noseColor":"#ffffff","minimalMouth":true,"minimalEyes":true,"minimalNose":false,"minimalBrows":false,"mouthLineThickness":0.2,"eyeLineThickness":0.2,"noseLineThickness":0.2,"browLineThickness":4},"channelGains":{},"activeMood":"neutral","moodTargetWeights":{"neutral":1},"id":"kln33e","name":"Wireface-001_kln33e"},
  {"version":"wireface-v010","createdAt":"2026-05-01T02:19:44.566Z","renderConfig":{"meshCols":21,"meshRows":21,"scaleNose":0.4,"scaleEyes":1.35,"scaleMouth":0.4,"reactivity":0.24,"spread":0.9,"mode":"wire","pupils":true,"meshVisible":true,"minimal":true,"fragment":true,"glow":true,"flipFace":true,"loopAudio":true,"mouthHole":true,"mouthHoleSize":1.15,"eyeHoles":true,"eyeDepth":5,"mouthAnchor":true,"eyeAnchor":true,"lineThickness":0.4,"lipVertAmp":4,"lipPressForce":3,"overlayTracksMesh":true,"moodTransitionTime":0.05,"lineColor":"#541717","pupilColor":"#c4b0b0","baseColor":"#ff8585","fadeColor":"#f00000","depthFade":1,"irisColor":"#ff0000","irisSize":3.3,"browColor":"#616161","jawExtend":0,"mouthGrow":0},"channelGains":{},"activeMood":"neutral","moodTargetWeights":{"neutral":1},"id":"th5rha","name":"asset__post__th5rha"},
  {"version":"wireface-v010","createdAt":"2026-05-01T02:00:12.074Z","renderConfig":{"meshCols":7,"meshRows":9,"scaleNose":1.15,"scaleEyes":2,"scaleMouth":2,"reactivity":0.26,"spread":0.8,"mode":"wire","pupils":true,"meshVisible":true,"minimal":true,"fragment":true,"glow":true,"flipFace":true,"loopAudio":true,"mouthHole":true,"mouthHoleSize":1.85,"eyeHoles":false,"eyeDepth":1,"mouthAnchor":true,"eyeAnchor":false,"lineThickness":1,"lipVertAmp":1.6,"lipPressForce":0,"overlayTracksMesh":true,"moodTransitionTime":0.05,"lineColor":"#181616","pupilColor":"#3a2727","baseColor":"#7a86c2","fadeColor":"#f00000","depthFade":0.4,"irisColor":"#170303","irisSize":2,"browColor":"#616161","jawExtend":0,"mouthGrow":0},"channelGains":{},"activeMood":"neutral","moodTargetWeights":{"neutral":1},"id":"ydr7de","name":"asset__post__ydr7de"},
  // ← append more here. the UI adapts to whatever length this array is.
];

const wf = createWireface(document.getElementById('cv'));
wf.setLoop(true);

let idx = 0;
const apply = () => wf.loadPreset(PRESETS[idx]);
const next = () => { idx = (idx + 1) % PRESETS.length; apply(); };
const prev = () => { idx = (idx - 1 + PRESETS.length) % PRESETS.length; apply(); };
const toggle = () => { wf.isPlaying() ? wf.pause() : wf.play(); syncPlayIcon(); };
apply();

/* play/pause icon swap. poll because loop/autoplay can flip state without our input. */
const PLAY_PATH  = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 5h4v14H6V5zm8 0h4v14h-4V5z';
const playIcon = document.getElementById('wf-play-icon');
let lastPlaying = null;
function syncPlayIcon() {
  const p = wf.isPlaying();
  if (p === lastPlaying) return;
  lastPlaying = p;
  playIcon.firstElementChild
    ? playIcon.firstElementChild.setAttribute('d', p ? PAUSE_PATH : PLAY_PATH)
    : playIcon.innerHTML = `<path d="${p ? PAUSE_PATH : PLAY_PATH}"/>`;
}
setInterval(syncPlayIcon, 200);

document.getElementById('wf-prev').addEventListener('click', prev);
document.getElementById('wf-next').addEventListener('click', next);
document.getElementById('wf-play').addEventListener('click', toggle);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    next();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    prev();
  } else if (e.key === ' ') {
    toggle();
    e.preventDefault();
  }
});

/* fetch the bundled TTS sample from jsDelivr's GitHub mirror (CORS-friendly,
   raw.githubusercontent.com isn't) and start playback. Browser autoplay
   policies require a user gesture for audio; on the playground that gesture
   is the click on the Run button so it works there. Locally, if it doesn't,
   space toggles play/pause. */
fetch('https://cdn.jsdelivr.net/gh/styk-tv/wireface@main/examples/Wireface-001-kokoro-santa.mp3')
  .then(r => r.blob())
  .then(blob => wf.loadAudio(new File([blob], 'sample.mp3')))
  .then(() => wf.play())
  .then(() => syncPlayIcon())
  .catch(() => {});

/* drag-drop your own .mp3 to override the sample */
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) { await wf.loadAudio(f); wf.play(); syncPlayIcon(); }
});

window.wf = wf;
</script>
</body>
</html>
